<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#FDFBF7">
    <title>{% block title %}Order bread · לחם בהר{% endblock %}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=7">
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-header shell">
      <a class="wordmark" href="/?lang=en">לחם בהר</a>
      <div class="header-tools">
        <a class="header-note" href="{% if week == 'next' %}/?lang=en{% else %}/?week=next&lang=en{% endif %}">{% if week == 'next' %}Coming delivery{% else %}Order for next week{% endif %}</a>
        <nav class="lang-switch" aria-label="Language">
          <a href="{{ switch_he }}" hreflang="he" lang="he">עברית</a>
          <a href="{{ switch_en }}" hreflang="en" lang="en" aria-current="true">English</a>
        </nav>
      </div>
    </header>
    <main id="main">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer shell">
      <p><span class="brand-inline">לחם בהר</span> · Baked to order · Payment by Grow</p>
    </footer>
    <script src="/static/js/checkout.js"></script>
  </body>
</html>
